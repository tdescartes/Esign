services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: esign
      POSTGRES_PASSWORD: esign
      POSTGRES_DB: esign
    ports:
      - "5432:5432"
    volumes:
      - esign-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U esign"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  esign-postgres-data:
